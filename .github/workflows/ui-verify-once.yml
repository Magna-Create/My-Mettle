name: One-off workout UI verify

on:
  push:
    branches:
      - agent/workout-ui-nbio6-upgrade
    paths:
      - .github/workflows/ui-verify-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/workout-ui-nbio6-upgrade
          fetch-depth: 0

      - name: Remove invalid BoxScope import
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/dev/kian/mymettle/ui/FigmaWorkoutSessionV2.kt')
          text = path.read_text()
          bad = 'import androidx.compose.foundation.layout.matchParentSize\n'
          if bad not in text:
              raise SystemExit('Expected matchParentSize import is missing')
          path.write_text(text.replace(bad, '', 1))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Install Android SDK 37
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Verify biological reference assets
        run: python3 tools/reference_data/generate_reference_assets.py --check

      - name: Test and build debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit verified import fix
        shell: bash
        run: |
          git config user.name "Magna-Create"
          git config user.email "53941598+Magna-Create@users.noreply.github.com"
          git add app/src/main/java/dev/kian/mymettle/ui/FigmaWorkoutSessionV2.kt
          git commit -m "Fix workout card BoxScope import"
          git push origin HEAD:agent/workout-ui-nbio6-upgrade
