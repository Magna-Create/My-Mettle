name: Patch N-BIO-7C codec string list

on:
  push:
    branches:
      - "agent/n-bio-vnext-inference"
    paths:
      - ".github/workflows/patch-nbio7c-codec-list.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/n-bio-vnext-inference
          fetch-depth: 0
      - name: Remove final modified-UTF path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/dev/kian/mymettle/inference/NonDynamicCapabilityParameterCodec.kt')
          text = p.read_text()
          old = 'values.forEach(::writeUTF)'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one remaining writeUTF list path, found {text.count(old)}')
          p.write_text(text.replace(old, 'values.forEach(::writeString)', 1))
          PY
          git diff --check
      - name: Commit patch and remove workflow
        run: |
          rm .github/workflows/patch-nbio7c-codec-list.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Complete N-BIO-7C UTF-8 codec migration"
          git push origin HEAD:agent/n-bio-vnext-inference
