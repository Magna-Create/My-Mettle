name: Android CI

on:
  push:
    branches:
      - main
      - "native/**"
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Install Android SDK 37
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Verify generated biological reference assets
        run: python3 tools/reference_data/generate_reference_assets.py --check

      - name: Verify exercise authoring JSON Schema
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check -r tools/exercise_authoring/requirements.txt
          python3 tools/exercise_authoring/validate_contract.py

      - name: Verify context interpretation architecture
        run: python3 tools/context_interpretation/verify_boundary.py

      - name: Verify Context Module author documentation
        run: python3 tools/context_modules/verify_docs.py

      - name: Check whitespace errors
        run: git diff --check

      - name: Clean generated Kotlin and Room outputs
        run: ./gradlew clean --stacktrace --no-daemon

      - name: Unit tests and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Compile instrumentation APK
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace --no-daemon

      - name: Android lint
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Verify exported Room schema
        shell: bash
        run: |
          test -f app/schemas/dev.kian.mymettle.data.local.MyMettleDatabase/15.json
          grep -q '"version": 15' app/schemas/dev.kian.mymettle.data.local.MyMettleDatabase/15.json
          test -f app/schemas/dev.kian.mymettle.data.local.MyMettleDatabase/16.json
          grep -q '"version": 16' app/schemas/dev.kian.mymettle.data.local.MyMettleDatabase/16.json
          test -f app/schemas/dev.kian.mymettle.data.local.MyMettleDatabase/17.json
          grep -q '"version": 17' app/schemas/dev.kian.mymettle.data.local.MyMettleDatabase/17.json

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: my-mettle-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Room schemas
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas-${{ github.sha }}
          path: app/schemas/dev.kian.mymettle.data.local.MyMettleDatabase
          if-no-files-found: error

  n-bio-7f-storage-proof:
    if: github.ref == 'refs/heads/agent/n-bio-vnext-inference'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Install Android SDK 37
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Execute targeted Room17 correction and Native backup proofs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.kian.mymettle.data.local.NBio7FRoom17CorrectionMigrationTest --stacktrace --no-daemon
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.kian.mymettle.data.backup.NBio7FEquipmentBackupRoundTripTest --stacktrace --no-daemon
