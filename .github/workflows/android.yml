name: Android CI

on:
  push:
    branches:
      - main
      - "native/**"
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Install Android SDK 37
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Verify generated biological reference assets
        run: python3 tools/reference_data/generate_reference_assets.py --check

      - name: Check whitespace errors
        run: git diff --check

      - name: Unit tests and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Compile instrumentation APK
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace --no-daemon

      - name: Android lint
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Verify exported Room schema
        shell: bash
        run: |
          test -f app/schemas/dev.kian.mymettle.data.local.MyMettleDatabase/13.json
          grep -q '"version": 13' app/schemas/dev.kian.mymettle.data.local.MyMettleDatabase/13.json

      - name: Upload Room schemas
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas-${{ github.sha }}
          path: app/schemas/dev.kian.mymettle.data.local.MyMettleDatabase
          if-no-files-found: error
