name: One-off exit workout UX rebuild

on:
  push:
    branches:
      - agent/workout-ui-nbio6-upgrade
    paths:
      - .github/workflows/exit-workout-rebuild-once.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/workout-ui-nbio6-upgrade
          fetch-depth: 0

      - name: Apply exit workout UX rebuild
        shell: bash
        env:
          EXIT_OVERLAY_B64: 
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import os

          app = Path("app/src/main/java/dev/kian/mymettle/ui/MyMettleApp.kt")
          text = app.read_text()

          old = "    val bottomBarHazeState = rememberHazeState()\n"
          new = """    val bottomBarHazeState = rememberHazeState()
    val workoutExitGestureState = remember { WorkoutExitGestureState() }

    LaunchedEffect(currentRoute, workoutViewModel.uiState.workout?.session?.id) {
        if (currentRoute != TRAIN_ROUTE || workoutViewModel.uiState.workout == null) {
            workoutExitGestureState.reset()
        }
    }
"""
          if text.count(old) != 1:
              raise SystemExit(f"MyMettleApp: bottomBarHazeState anchor count={text.count(old)}")
          text = text.replace(old, new, 1)

          old = """        CompositionLocalProvider(
            LocalMettleHazeState provides hazeState,
            LocalMettleWindowWidthClass provides windowWidthClass,
        ) {
"""
          new = """        CompositionLocalProvider(
            LocalMettleHazeState provides hazeState,
            LocalMettleWindowWidthClass provides windowWidthClass,
            LocalWorkoutExitGestureState provides workoutExitGestureState,
        ) {
"""
          if text.count(old) != 1:
              raise SystemExit("MyMettleApp: CompositionLocalProvider anchor mismatch")
          text = text.replace(old, new, 1)

          old = "                    if (!finishOverlayVisible) CompositionLocalProvider(LocalMettleHazeState provides bottomBarHazeState) {\n"
          new = "                    CompositionLocalProvider(LocalMettleHazeState provides bottomBarHazeState) {\n"
          if text.count(old) != 1:
              raise SystemExit("MyMettleApp: finish-overlay hotbar anchor mismatch")
          text = text.replace(old, new, 1)

          old = """                            preserveEdgeDefinition = currentRoute == HOME_ROUTE,
"""
          new = """                            preserveEdgeDefinition = currentRoute == HOME_ROUTE,
                            finishOverlayVisible = finishOverlayVisible,
                            enableFinishDrag = currentRoute == TRAIN_ROUTE && workoutViewModel.uiState.workout != null,
"""
          if text.count(old) != 1:
              raise SystemExit("MyMettleApp: toolbar parameter anchor mismatch")
          text = text.replace(old, new, 1)
          app.write_text(text)

          workout = Path("app/src/main/java/dev/kian/mymettle/ui/FigmaWorkoutSession.kt")
          text = workout.read_text()

          old = "import androidx.compose.ui.layout.ContentScale\n"
          new = "import androidx.compose.ui.layout.ContentScale\nimport androidx.compose.ui.layout.onGloballyPositioned\n"
          if text.count(old) != 1:
              raise SystemExit("FigmaWorkoutSession: ContentScale import anchor mismatch")
          text = text.replace(old, new, 1)

          old = """                    FinishWorkoutGestureOverlay(
                        destructive = false,
                        onDismiss = onDismissSheet,
                        onComplete = onCompleteSession,
                        onCompleteWithoutReview = onCompleteWithoutReview,
                        onDelete = onShowDelete,
                    )
"""
          new = """                    FinishWorkoutGestureOverlay(
                        destructive = false,
                        onOpenSettings = onOpenSettings,
                        onOpenAccount = onOpenAccount,
                        onDismiss = onDismissSheet,
                        onComplete = onCompleteSession,
                        onCompleteWithoutReview = onCompleteWithoutReview,
                        onDelete = onDiscardSession,
                    )
"""
          if text.count(old) != 1:
              raise SystemExit("FigmaWorkoutSession: FINISH overlay call anchor mismatch")
          text = text.replace(old, new, 1)

          old = """                    FinishWorkoutGestureOverlay(
                        destructive = true,
                        onDismiss = onDismissSheet,
                        onComplete = onCompleteSession,
                        onCompleteWithoutReview = onCompleteWithoutReview,
                        onDelete = onDiscardSession,
                    )
"""
          new = """                    FinishWorkoutGestureOverlay(
                        destructive = true,
                        onOpenSettings = onOpenSettings,
                        onOpenAccount = onOpenAccount,
                        onDismiss = onDismissSheet,
                        onComplete = onCompleteSession,
                        onCompleteWithoutReview = onCompleteWithoutReview,
                        onDelete = onDiscardSession,
                    )
"""
          if text.count(old) != 1:
              raise SystemExit("FigmaWorkoutSession: DELETE_CONFIRM overlay call anchor mismatch")
          text = text.replace(old, new, 1)

          start_marker = "private enum class FinishChoice"
          end_marker = "private fun workoutPrescriptionLabels"
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit("FigmaWorkoutSession: finish-overlay block markers missing")
          replacement = base64.b64decode(os.environ["EXIT_OVERLAY_B64"]).decode()
          text = text[:start] + replacement + text[end:]
          workout.write_text(text)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Install Android SDK 37
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Verify biological reference assets
        run: python3 tools/reference_data/generate_reference_assets.py --check

      - name: Test and build debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit verified exit workout UX
        shell: bash
        run: |
          git config user.name "Magna-Create"
          git config user.email "53941598+Magna-Create@users.noreply.github.com"
          git add app/src/main/java/dev/kian/mymettle/ui/MyMettleApp.kt \
                  app/src/main/java/dev/kian/mymettle/ui/FigmaWorkoutSession.kt
          git commit -m "Rebuild exit workout drag UX"
          git push origin HEAD:agent/workout-ui-nbio6-upgrade
