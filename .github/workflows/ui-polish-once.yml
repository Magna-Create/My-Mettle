name: One-off workout UI polish

on:
  push:
    branches:
      - agent/workout-ui-nbio6-upgrade
    paths:
      - .github/workflows/ui-polish-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/workout-ui-nbio6-upgrade
          fetch-depth: 0

      - name: Apply workout UI polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          v2_path = Path('app/src/main/java/dev/kian/mymettle/ui/FigmaWorkoutSessionV2.kt')
          s = v2_path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global s
              if old not in s:
                  raise SystemExit(f'Missing V2 patch anchor: {label}')
              s = s.replace(old, new, 1)

          replace_once(
              'import androidx.compose.foundation.layout.fillMaxWidth\nimport androidx.compose.foundation.layout.height\n',
              'import androidx.compose.foundation.layout.fillMaxWidth\nimport androidx.compose.foundation.layout.height\nimport androidx.compose.foundation.layout.matchParentSize\n',
              'matchParentSize import',
          )
          replace_once(
              'import androidx.compose.ui.draw.blur\nimport androidx.compose.ui.draw.clip\n',
              'import androidx.compose.ui.draw.blur\nimport androidx.compose.ui.draw.clip\nimport androidx.compose.ui.draw.dropShadow\n',
              'dropShadow import',
          )
          replace_once(
              'import androidx.compose.ui.graphics.drawscope.Stroke\nimport androidx.compose.ui.layout.ContentScale\n',
              'import androidx.compose.ui.graphics.drawscope.Stroke\nimport androidx.compose.ui.graphics.shadow.Shadow\nimport androidx.compose.ui.layout.ContentScale\n',
              'Shadow import',
          )
          replace_once(
              'import androidx.compose.ui.unit.Dp\nimport androidx.compose.ui.unit.DpSize\n',
              'import androidx.compose.ui.unit.Dp\nimport androidx.compose.ui.unit.DpOffset\nimport androidx.compose.ui.unit.DpSize\n',
              'DpOffset import',
          )

          # Legacy PER_SIDE data is a concrete unilateral signal. N-BIO-6 stores LEFT/RIGHT
          # observations, so resolve that compatibility once and use it for every workout UI rule.
          s = s.replace('exercise.lateralityMode', 'exercise.resolvedWorkoutLateralityMode()')

          replace_once(
              '''    Surface(\n        modifier = Modifier.fillMaxWidth(),\n        shape = WorkoutV2CardShape,\n        color = if (completed) WorkoutV2GreenDark.copy(alpha = .78f) else WorkoutV2Card,\n        border = BorderStroke(metrics.dp(.7), Color.White.copy(alpha = if (focused) .18f else .10f)),\n        shadowElevation = metrics.dp(if (focused) 5 else 2),\n    ) {\n        Column {\n''',
              '''    val cardHazeState = rememberHazeState()\n    val cardColor = if (completed) WorkoutV2GreenDark.copy(alpha = .78f) else WorkoutV2Card\n    Box(\n        modifier = Modifier\n            .fillMaxWidth()\n            .dropShadow(\n                shape = WorkoutV2CardShape,\n                shadow = Shadow(\n                    radius = metrics.dp(if (focused) 7 else 4.5),\n                    spread = 0.dp,\n                    color = Color.Black.copy(alpha = if (focused) .30f else .22f),\n                    offset = DpOffset(0.dp, metrics.dp(if (focused) 2.6 else 1.7)),\n                ),\n            )\n            .mettleDirectionalBorder(\n                width = metrics.dp(.7),\n                color = Color.White.copy(alpha = if (focused) .18f else .11f),\n                shape = WorkoutV2CardShape,\n            )\n            .clip(WorkoutV2CardShape),\n    ) {\n        // Restrict the Haze source to the clipped card paint. Sampling an elevated Surface was\n        // producing the large rectangular ghost layer visible behind cards while scrolling.\n        Box(\n            Modifier\n                .matchParentSize()\n                .hazeSource(cardHazeState)\n                .background(cardColor),\n        )\n        CompositionLocalProvider(LocalMettleHazeState provides cardHazeState) {\n            Column {\n''',
              'card haze wrapper',
          )
          replace_once(
              '''                }\n            }\n        }\n    }\n}\n\n@Composable\nprivate fun WorkoutV2LogicalSetGroup(\n''',
              '''                }\n            }\n        }\n        }\n    }\n}\n\n@Composable\nprivate fun WorkoutV2LogicalSetGroup(\n''',
              'card haze wrapper close',
          )

          replace_once(
              '''                    Column(\n                        Modifier.padding(\n                            start = metrics.dp(15),\n                            end = metrics.dp(15),\n                            top = metrics.dp(15),\n                        ),\n                        verticalArrangement = Arrangement.spacedBy(metrics.dp(9)),\n                    ) {\n''',
              '''                    Column(\n                        Modifier.padding(\n                            start = metrics.dp(15),\n                            end = metrics.dp(15),\n                            top = metrics.dp(15),\n                        ),\n                        verticalArrangement = Arrangement.spacedBy(\n                            metrics.dp(\n                                if (exercise.resolvedWorkoutLateralityMode() == LateralityMode.UNILATERAL) 9 else 2.5,\n                            ),\n                        ),\n                    ) {\n''',
              'logical set spacing',
          )
          replace_once(
              '''                            WorkoutV2LogicalSetGroup(\n                                displayIndex = index,\n                                exercise = exercise,\n''',
              '''                            WorkoutV2LogicalSetGroup(\n                                displayIndex = index,\n                                groupIndex = index,\n                                groupLastIndex = sets.lastIndex,\n                                exercise = exercise,\n''',
              'logical set group indices call',
          )
          replace_once(
              '''private fun WorkoutV2LogicalSetGroup(\n    displayIndex: Int,\n    exercise: ActiveWorkoutExercise,\n''',
              '''private fun WorkoutV2LogicalSetGroup(\n    displayIndex: Int,\n    groupIndex: Int,\n    groupLastIndex: Int,\n    exercise: ActiveWorkoutExercise,\n''',
              'logical set group indices signature',
          )
          replace_once(
              '                sides.size == 1 -> RoundedCornerShape(metrics.dp(25))\n',
              '                sides.size == 1 -> workoutV2GroupedSetShape(groupIndex, groupLastIndex, metrics)\n',
              'bilateral set radius',
          )
          replace_once(
              '''}\n\n@Composable\nprivate fun WorkoutV2ObservationRow(\n''',
              '''}\n\nprivate fun workoutV2GroupedSetShape(\n    index: Int,\n    lastIndex: Int,\n    metrics: WorkoutV2Metrics,\n): RoundedCornerShape {\n    val outer = metrics.dp(25)\n    val inner = metrics.dp(5)\n    return when {\n        lastIndex == 0 -> RoundedCornerShape(outer)\n        index == 0 -> RoundedCornerShape(\n            topStart = outer,\n            topEnd = outer,\n            bottomStart = inner,\n            bottomEnd = inner,\n        )\n        index == lastIndex -> RoundedCornerShape(\n            topStart = inner,\n            topEnd = inner,\n            bottomStart = outer,\n            bottomEnd = outer,\n        )\n        else -> RoundedCornerShape(inner)\n    }\n}\n\n@Composable\nprivate fun WorkoutV2ObservationRow(\n''',
              'grouped set radius helper',
          )

          # Keep the new cut-out/refraction appearance, but give card controls a restrained tertiary
          # dark underlay so their boundaries remain legible on bright portions of the card.
          replace_once(
              '                    tint = if (completed) WorkoutV2Green.copy(alpha = .10f) else WorkoutV2Cyan.copy(alpha = .055f),\n                    borderColor =',
              '                    tint = if (completed) WorkoutV2Green.copy(alpha = .10f) else WorkoutV2Cyan.copy(alpha = .055f),\n                    baseColor = WorkoutV2DarkCyan.copy(alpha = .20f),\n                    borderColor =',
              'exercise icon tertiary underlay',
          )
          replace_once(
              '        baseColor = WorkoutV2DarkCyan.copy(alpha = .72f),\n',
              '        baseColor = WorkoutV2DarkCyan.copy(alpha = .22f),\n',
              'metric tertiary underlay',
          )
          replace_once(
              '''        tint = tint.copy(alpha = .035f),\n        borderColor = tint.copy(alpha = .35f),\n''',
              '''        tint = tint.copy(alpha = .035f),\n        baseColor = WorkoutV2DarkCyan.copy(alpha = .22f),\n        borderColor = tint.copy(alpha = .35f),\n''',
              'round icon tertiary underlay',
          )
          replace_once(
              '''            tint = WorkoutV2Cyan.copy(alpha = .035f),\n            borderColor = WorkoutV2Cyan.copy(alpha = .32f),\n''',
              '''            tint = WorkoutV2Cyan.copy(alpha = .035f),\n            baseColor = WorkoutV2DarkCyan.copy(alpha = .20f),\n            borderColor = WorkoutV2Cyan.copy(alpha = .32f),\n''',
              'setup add-photo tertiary underlay',
          )
          replace_once(
              '        fill = if (success) WorkoutV2Green.copy(alpha = .028f) else WorkoutV2DarkCyan.copy(alpha = .055f),\n',
              '        fill = if (success) WorkoutV2Green.copy(alpha = .028f) else WorkoutV2DarkCyan.copy(alpha = .18f),\n',
              'metadata pill tertiary underlay',
          )
          replace_once(
              '        containerTint = WorkoutV2Cyan.copy(alpha = .055f),\n',
              '        containerTint = WorkoutV2DarkCyan.copy(alpha = .22f),\n',
              'action button tertiary underlay',
          )

          replace_once(
              '''            if (!editMode) {\n                if (link.isNotBlank()) {\n                    WorkoutV2RoundIconButton(\n                        icon = MettleIcons.ArrowForward,\n                        description = "Open exercise link",\n                        tint = WorkoutV2Cyan,\n                        onClick = { onOpenLink(link) },\n                        metrics = metrics,\n                    )\n                    Spacer(Modifier.width(metrics.dp(10)))\n                }\n                WorkoutV2RoundIconButton(\n''',
              '''            if (!editMode) {\n                WorkoutV2RoundIconButton(\n                    icon = WorkoutLinkIcons.Link,\n                    description = "Open exercise link",\n                    tint = WorkoutV2Cyan,\n                    onClick = { if (link.isNotBlank()) onOpenLink(link) },\n                    enabled = link.isNotBlank(),\n                    metrics = metrics,\n                )\n                Spacer(Modifier.width(metrics.dp(10)))\n                WorkoutV2RoundIconButton(\n''',
              'open link button',
          )
          replace_once(
              '''                WorkoutV2RoundIconButton(\n                    icon = MettleIcons.ArrowForward,\n                    description = "Edit exercise link",\n''',
              '''                WorkoutV2RoundIconButton(\n                    icon = WorkoutLinkIcons.AddLink,\n                    description = "Edit exercise link",\n''',
              'edit link icon',
          )
          replace_once(
              '        dismissButton = { TextButton(onClick = onDismiss) { Text("Discard", color = WorkoutV2Delete) } },\n        confirmButton = { TextButton(onClick = { onSave(draft) })',
              '        dismissButton = { TextButton(onClick = onDismiss) { Text("Discard Changes", color = WorkoutV2Delete) } },\n        confirmButton = { TextButton(onClick = { onSave(draft) })',
              'instruction dialog discard label',
          )

          v2_path.write_text(s)

          Path('app/src/main/java/dev/kian/mymettle/ui/WorkoutLateralityCompat.kt').write_text('''package dev.kian.mymettle.ui\n\nimport dev.kian.mymettle.domain.exercise.EntryBasis\nimport dev.kian.mymettle.domain.performance.LateralityMode\nimport dev.kian.mymettle.workout.ActiveWorkoutExercise\n\n/**\n * Compatibility bridge for translated Lite data. Legacy PER_SIDE was the explicit statement that\n * the entered performance belongs to one side. Older N-BIO-6 imports left lateralityMode UNKNOWN,\n * so resolve that signal at the workout boundary without rewriting historical observations.\n */\ninternal fun ActiveWorkoutExercise.resolvedWorkoutLateralityMode(): LateralityMode =\n    if (lateralityMode == LateralityMode.UNKNOWN && entryBasis == EntryBasis.PER_SIDE) {\n        LateralityMode.UNILATERAL\n    } else {\n        lateralityMode\n    }\n''')

          Path('app/src/main/java/dev/kian/mymettle/ui/WorkoutLinkIcons.kt').write_text('''package dev.kian.mymettle.ui\n\nimport androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.graphics.SolidColor\nimport androidx.compose.ui.graphics.vector.ImageVector\nimport androidx.compose.ui.graphics.vector.PathParser\nimport androidx.compose.ui.unit.dp\n\n/** Link glyphs matched to the Setup View / Setup Edit Mode Figma controls. */\ninternal object WorkoutLinkIcons {\n    val Link: ImageVector by lazy {\n        workoutLinkIcon(\n            name = "workout_open_link",\n            pathData = "M3.9 12C3.9 10.29 5.29 8.9 7 8.9H11V7H7C4.24 7 2 9.24 2 12C2 14.76 4.24 17 7 17H11V15.1H7C5.29 15.1 3.9 13.71 3.9 12ZM8 13H16V11H8V13ZM17 7H13V8.9H17C18.71 8.9 20.1 10.29 20.1 12C20.1 13.71 18.71 15.1 17 15.1H13V17H17C19.76 17 22 14.76 22 12C22 9.24 19.76 7 17 7Z",\n        )\n    }\n\n    val AddLink: ImageVector by lazy {\n        workoutLinkIcon(\n            name = "workout_add_link",\n            pathData = "M3.9 12C3.9 10.29 5.29 8.9 7 8.9H11V7H7C4.24 7 2 9.24 2 12C2 14.76 4.24 17 7 17H11V15.1H7C5.29 15.1 3.9 13.71 3.9 12ZM8 13H15V11H8V13ZM17 7H13V8.9H17C18.46 8.9 19.69 9.91 20.02 11.27C20.61 11.11 21.24 11.02 21.89 11.02H22C21.54 8.72 19.48 7 17 7ZM19 14V17H16V19H19V22H21V19H24V17H21V14H19Z",\n        )\n    }\n}\n\nprivate fun workoutLinkIcon(name: String, pathData: String): ImageVector = ImageVector.Builder(\n    name = name,\n    defaultWidth = 24.dp,\n    defaultHeight = 24.dp,\n    viewportWidth = 24f,\n    viewportHeight = 24f,\n).apply {\n    addPath(\n        pathData = PathParser().parsePathString(pathData).toNodes(),\n        fill = SolidColor(Color.Black),\n    )\n}.build()\n''')

          vm_path = Path('app/src/main/java/dev/kian/mymettle/ui/N2WorkoutViewModel.kt')
          vm = vm_path.read_text()
          old = '''        val wasLogicalSetComplete = exercise.sets\n            .firstOrNull { it.id == setId }\n            ?.isCompleteFor(exercise.lateralityMode) == true\n'''
          new = '''        val resolvedLateralityMode = exercise.resolvedWorkoutLateralityMode()\n        val wasLogicalSetComplete = exercise.sets\n            .firstOrNull { it.id == setId }\n            ?.isCompleteFor(resolvedLateralityMode) == true\n'''
          if old not in vm:
              raise SystemExit('Missing ViewModel pre-save laterality anchor')
          vm = vm.replace(old, new, 1)
          old = '''                val logicalSetJustCompleted = logged &&\n                    !wasLogicalSetComplete &&\n                    refreshedSet?.isCompleteFor(exercise.lateralityMode) == true\n'''
          new = '''                val logicalSetJustCompleted = logged &&\n                    !wasLogicalSetComplete &&\n                    refreshedSet?.isCompleteFor(resolvedLateralityMode) == true\n'''
          if old not in vm:
              raise SystemExit('Missing ViewModel post-save laterality anchor')
          vm_path.write_text(vm.replace(old, new, 1))

          review_path = Path('app/src/main/java/dev/kian/mymettle/ui/ExerciseReflectionOverlay.kt')
          review = review_path.read_text()
          def rr(old: str, new: str, label: str) -> None:
              global review
              if old not in review:
                  raise SystemExit(f'Missing review patch anchor: {label}')
              review = review.replace(old, new, 1)

          rr(
              'import androidx.compose.runtime.Composable\nimport androidx.compose.runtime.getValue\n',
              'import androidx.compose.runtime.Composable\nimport androidx.compose.runtime.LaunchedEffect\nimport androidx.compose.runtime.getValue\n',
              'LaunchedEffect import',
          )
          rr(
              'import androidx.compose.ui.Modifier\nimport androidx.compose.ui.graphics.Color\n',
              'import androidx.compose.ui.Modifier\nimport androidx.compose.ui.focus.FocusRequester\nimport androidx.compose.ui.focus.focusRequester\nimport androidx.compose.ui.graphics.Color\n',
              'focus imports',
          )
          rr(
              'import androidx.compose.ui.text.font.FontWeight\n',
              'import androidx.compose.ui.platform.LocalSoftwareKeyboardController\nimport androidx.compose.ui.text.font.FontWeight\n',
              'keyboard controller import',
          )
          rr(
              'import androidx.compose.ui.unit.sp\n',
              'import androidx.compose.ui.unit.sp\nimport kotlinx.coroutines.delay\n',
              'delay import',
          )
          rr(
              '''    val target = state.reflectionTarget ?: return\n    var text by remember(target.entity.id, state.reflection?.updatedAt) {\n''',
              '''    val target = state.reflectionTarget ?: return\n    val focusRequester = remember { FocusRequester() }\n    val keyboardController = LocalSoftwareKeyboardController.current\n    var text by remember(target.entity.id, state.reflection?.updatedAt) {\n''',
              'focus state',
          )
          rr(
              '''        mutableStateOf(TextFieldValue(state.reflection?.note.orEmpty()))\n    }\n\n    AlertDialog(\n''',
              '''        mutableStateOf(TextFieldValue(state.reflection?.note.orEmpty()))\n    }\n\n    LaunchedEffect(target.entity.id) {\n        delay(90)\n        focusRequester.requestFocus()\n        keyboardController?.show()\n    }\n\n    AlertDialog(\n''',
              'auto-focus effect',
          )
          rr(
              '        modifier = Modifier.fillMaxWidth(.78f),\n',
              '        modifier = Modifier.fillMaxWidth(.88f),\n',
              'review width',
          )
          rr(
              '''                    modifier = Modifier\n                        .fillMaxWidth()\n                        .heightIn(min = 250.dp),\n''',
              '''                    modifier = Modifier\n                        .fillMaxWidth()\n                        .heightIn(min = 250.dp)\n                        .focusRequester(focusRequester),\n''',
              'review focus requester',
          )
          review_path.write_text(review)
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "No patch changes produced."
            exit 1
          fi
          git config user.name "Magna-Create"
          git config user.email "53941598+Magna-Create@users.noreply.github.com"
          git add app/src/main/java/dev/kian/mymettle/ui/FigmaWorkoutSessionV2.kt \
                  app/src/main/java/dev/kian/mymettle/ui/N2WorkoutViewModel.kt \
                  app/src/main/java/dev/kian/mymettle/ui/ExerciseReflectionOverlay.kt \
                  app/src/main/java/dev/kian/mymettle/ui/WorkoutLateralityCompat.kt \
                  app/src/main/java/dev/kian/mymettle/ui/WorkoutLinkIcons.kt
          git commit -m "Polish workout set groups, links and review UI"
          git push origin HEAD:agent/workout-ui-nbio6-upgrade
