name: Diagnose N-BIO-7C unit failures

on:
  push:
    branches:
      - "agent/n-bio-vnext-inference"
    paths:
      - ".github/workflows/diagnose-nbio7c-unit-failures.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/n-bio-vnext-inference
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 37
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Run focused failing tests
        shell: bash
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest \
            --tests 'dev.kian.mymettle.developer.NBio7CSyntheticValidationTest' \
            --tests 'dev.kian.mymettle.inference.NonDynamicCapabilityParameterCodecTest' \
            --stacktrace --no-daemon
          status=$?
          echo '===== focused JUnit XML ====='
          find app/build/test-results/testDebugUnitTest -maxdepth 1 -type f -name '*.xml' -print -exec cat {} \; 2>/dev/null || true
          echo "focused_gradle_status=$status"
          exit 0
