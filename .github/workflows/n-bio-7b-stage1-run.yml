name: N-BIO-7B Stage1 Run
on:
  push:
    branches: [agent/n-bio-vnext-inference]
    paths: [.github/workflows/n-bio-7b-stage1-run.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android SDK 37
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Apply Stage-1 product patch
        run: python3 tools/n_bio_7b_stage1_apply.py
      - name: Check product diff
        run: git diff --check
      - name: Unit tests and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Compile instrumentation APK
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace --no-daemon
      - name: Commit product tree
        run: |
          git config user.name 'Magna-Create'
          git config user.email '53941598+Magna-Create@users.noreply.github.com'
          git add -A
          git commit -m 'Add N-BIO-7B Candidate-v1 temporal diagnostics'
          git push origin HEAD:agent/n-bio-vnext-inference
