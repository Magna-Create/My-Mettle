name: One-off exit and setup-photo rebuild

on:
  push:
    branches:
      - agent/workout-ui-nbio6-upgrade
    paths:
      - .github/workflows/exit-photo-rebuild-once.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/workout-ui-nbio6-upgrade
          fetch-depth: 0

      - name: Patch exit UX and setup photo deletion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # WorkoutExitOverlay: make root coordinates reactive and keep helpers scope-independent.
          p = 'app/src/main/java/dev/kian/mymettle/ui/WorkoutExitOverlay.kt'
          replace_once(p,
          '''    val exitHazeState = rememberHazeState()\n\n    BoxWithConstraints(\n        Modifier\n            .fillMaxSize()\n            .onGloballyPositioned { coordinates ->\n                ExitOverlayOrigin.root = coordinates.localToRoot(Offset.Zero)\n            },\n    ) {''',
          '''    val exitHazeState = rememberHazeState()\n    var overlayOriginRoot by remember { mutableStateOf(Offset.Zero) }\n\n    BoxWithConstraints(\n        Modifier\n            .fillMaxSize()\n            .onGloballyPositioned { coordinates ->\n                overlayOriginRoot = coordinates.localToRoot(Offset.Zero)\n            },\n    ) {''')
          replace_once(p, '        val originRoot = ExitOverlayOrigin.root', '        val originRoot = overlayOriginRoot')
          replace_once(p, 'private fun BoxWithConstraintsScope.ExitTargetSurface(', 'private fun ExitTargetSurface(')
          replace_once(p, 'private fun BoxWithConstraintsScope.ExitDockGhost(', 'private fun ExitDockGhost(')
          replace_once(p,
          '''private object ExitOverlayOrigin {\n    var root: Offset = Offset.Zero\n}\n\n''', '')

          # App shell: keep the hotbar pointer owner alive while its visuals disappear under Exit.
          p = 'app/src/main/java/dev/kian/mymettle/ui/MyMettleApp.kt'
          replace_once(p,
          '''    val bottomBarHazeState = rememberHazeState()\n''',
          '''    val bottomBarHazeState = rememberHazeState()\n    val workoutExitGestureState = remember { WorkoutExitGestureState() }\n''')
          replace_once(p,
          '''            LocalMettleHazeState provides hazeState,\n            LocalMettleWindowWidthClass provides windowWidthClass,\n''',
          '''            LocalMettleHazeState provides hazeState,\n            LocalMettleWindowWidthClass provides windowWidthClass,\n            LocalWorkoutExitGestureState provides workoutExitGestureState,\n''')
          replace_once(p,
          '''                    if (!finishOverlayVisible) CompositionLocalProvider(LocalMettleHazeState provides bottomBarHazeState) {''',
          '''                    CompositionLocalProvider(LocalMettleHazeState provides bottomBarHazeState) {''')
          replace_once(p,
          '''                            preserveEdgeDefinition = currentRoute == HOME_ROUTE,\n                        )''',
          '''                            preserveEdgeDefinition = currentRoute == HOME_ROUTE,\n                            finishOverlayVisible = finishOverlayVisible,\n                            enableFinishDrag = currentRoute == TRAIN_ROUTE && workoutViewModel.uiState.workout != null,\n                        )''')

          # N-BIO workout renderer: own the Figma Exit overlay instead of delegating FINISH to legacy.
          p = 'app/src/main/java/dev/kian/mymettle/ui/FigmaWorkoutSessionV2.kt'
          replace_once(p,
          '''    onAddSetupPhoto: (ActiveWorkoutExercise) -> Unit,\n    onSaveSetupDetails: (ActiveWorkoutExercise, String, String, String) -> Unit,''',
          '''    onAddSetupPhoto: (ActiveWorkoutExercise) -> Unit,\n    onDeleteSetupPhoto: (ActiveWorkoutExercise, String) -> Unit,\n    onSaveSetupDetails: (ActiveWorkoutExercise, String, String, String) -> Unit,''')
          replace_once(p,
          '''    val delegateToLegacy = state.swapTarget != null || state.workoutSurface in setOf(\n        WorkoutSurface.QUICK_SELECT,\n        WorkoutSurface.FINISH,\n        WorkoutSurface.DELETE_CONFIRM,\n    )''',
          '''    val delegateToLegacy = state.swapTarget != null || state.workoutSurface == WorkoutSurface.QUICK_SELECT''')
          replace_once(p,
          '''                        savingSetupDetails = state.savingSetupDetails,\n                        drafts = drafts,''',
          '''                        savingSetupDetails = state.savingSetupDetails,\n                        savingSetupPhoto = state.savingSetupPhoto,\n                        drafts = drafts,''')
          replace_once(p,
          '''                        onAddSetupPhoto = onAddSetupPhoto,\n                        onSaveSetupDetails = onSaveSetupDetails,''',
          '''                        onAddSetupPhoto = onAddSetupPhoto,\n                        onDeleteSetupPhoto = onDeleteSetupPhoto,\n                        onSaveSetupDetails = onSaveSetupDetails,''')
          replace_once(p,
          '''            CompositionLocalProvider(LocalMettleHazeState provides headerHazeState) {\n                WorkoutV2Header(workout, metrics, onOpenSettings, onOpenAccount)\n            }\n''',
          '''            CompositionLocalProvider(LocalMettleHazeState provides headerHazeState) {\n                WorkoutV2Header(workout, metrics, onOpenSettings, onOpenAccount)\n            }\n            if (state.workoutSurface in setOf(WorkoutSurface.FINISH, WorkoutSurface.DELETE_CONFIRM)) {\n                WorkoutExitOverlay(\n                    onOpenSettings = onOpenSettings,\n                    onOpenAccount = onOpenAccount,\n                    onDismiss = onDismissSheet,\n                    onCompleteAndRate = onCompleteSession,\n                    onComplete = onCompleteWithoutReview,\n                    onDelete = onDiscardSession,\n                )\n            }\n''')
          replace_once(p,
          '''    loadingSetupDetails: Boolean,\n    savingSetupDetails: Boolean,\n    drafts: MutableMap<String, TrainSetDraft>,''',
          '''    loadingSetupDetails: Boolean,\n    savingSetupDetails: Boolean,\n    savingSetupPhoto: Boolean,\n    drafts: MutableMap<String, TrainSetDraft>,''')
          replace_once(p,
          '''    onShowSetup: () -> Unit,\n    onAddSetupPhoto: (ActiveWorkoutExercise) -> Unit,\n    onSaveSetupDetails: (ActiveWorkoutExercise, String, String, String) -> Unit,''',
          '''    onShowSetup: () -> Unit,\n    onAddSetupPhoto: (ActiveWorkoutExercise) -> Unit,\n    onDeleteSetupPhoto: (ActiveWorkoutExercise, String) -> Unit,\n    onSaveSetupDetails: (ActiveWorkoutExercise, String, String, String) -> Unit,''')
          replace_once(p,
          '''                savingSetupDetails = savingSetupDetails,\n                drafts = drafts,''',
          '''                savingSetupDetails = savingSetupDetails,\n                savingSetupPhoto = savingSetupPhoto,\n                drafts = drafts,''')
          replace_once(p,
          '''                onAddSetupPhoto = { onAddSetupPhoto(exercise) },\n                onSaveSetupDetails = { exerciseInstructions, setupInstructions, url ->''',
          '''                onAddSetupPhoto = { onAddSetupPhoto(exercise) },\n                onDeleteSetupPhoto = { relativePath -> onDeleteSetupPhoto(exercise, relativePath) },\n                onSaveSetupDetails = { exerciseInstructions, setupInstructions, url ->''')
          replace_once(p,
          '''    loadingSetupDetails: Boolean,\n    savingSetupDetails: Boolean,\n    drafts: MutableMap<String, TrainSetDraft>,''',
          '''    loadingSetupDetails: Boolean,\n    savingSetupDetails: Boolean,\n    savingSetupPhoto: Boolean,\n    drafts: MutableMap<String, TrainSetDraft>,''')
          replace_once(p,
          '''    onSetup: () -> Unit,\n    onAddSetupPhoto: () -> Unit,\n    onSaveSetupDetails: (String, String, String) -> Unit,''',
          '''    onSetup: () -> Unit,\n    onAddSetupPhoto: () -> Unit,\n    onDeleteSetupPhoto: (String) -> Unit,\n    onSaveSetupDetails: (String, String, String) -> Unit,''')
          replace_once(p,
          '''                    saving = savingSetupDetails,\n                    onAddPhoto = onAddSetupPhoto,\n                    onSave = onSaveSetupDetails,''',
          '''                    saving = savingSetupDetails,\n                    photoMutationInProgress = savingSetupPhoto,\n                    onAddPhoto = onAddSetupPhoto,\n                    onDeletePhoto = onDeleteSetupPhoto,\n                    onSave = onSaveSetupDetails,''')
          replace_once(p,
          '''    saving: Boolean,\n    onAddPhoto: () -> Unit,\n    onSave: (String, String, String) -> Unit,''',
          '''    saving: Boolean,\n    photoMutationInProgress: Boolean,\n    onAddPhoto: () -> Unit,\n    onDeletePhoto: (String) -> Unit,\n    onSave: (String, String, String) -> Unit,''')
          replace_once(p,
          '''    var editMode by remember(exercise.entity.id) { mutableStateOf(false) }\n    var dialog by remember(exercise.entity.id) { mutableStateOf<WorkoutSetupDialog?>(null) }\n''',
          '''    var editMode by remember(exercise.entity.id) { mutableStateOf(false) }\n    var dialog by remember(exercise.entity.id) { mutableStateOf<WorkoutSetupDialog?>(null) }\n    var pendingDeletePhoto by remember(exercise.entity.id) { mutableStateOf<String?>(null) }\n''')
          replace_once(p,
          '''        Spacer(Modifier.height(metrics.dp(14)))\n        WorkoutV2SetupMediaStrip(exercise.details.setupMediaPaths, onAddPhoto, metrics)\n        Spacer(Modifier.height(metrics.dp(20)))''',
          '''        Spacer(Modifier.height(metrics.dp(14)))\n        WorkoutV2SetupMediaStrip(\n            paths = exercise.details.setupMediaPaths,\n            editMode = editMode,\n            mutationInProgress = photoMutationInProgress,\n            onAddPhoto = onAddPhoto,\n            onRequestDelete = { pendingDeletePhoto = it },\n            metrics = metrics,\n        )\n        Spacer(Modifier.height(metrics.dp(20)))''')
          replace_once(p,
          '''        null -> Unit\n    }\n}\n\n@Composable\nprivate fun WorkoutV2EditableTextBlock''',
          '''        null -> Unit\n    }\n\n    pendingDeletePhoto?.let { relativePath ->\n        AlertDialog(\n            onDismissRequest = { if (!photoMutationInProgress) pendingDeletePhoto = null },\n            shape = RoundedCornerShape(28.dp),\n            containerColor = Color(0xFF272B25),\n            tonalElevation = 0.dp,\n            title = { Text("Delete setup photo?", color = WorkoutV2Paper, fontSize = 24.sp, lineHeight = 32.sp) },\n            text = {\n                Text(\n                    "This photo will be permanently removed from this exercise.",\n                    color = WorkoutV2Muted,\n                    fontSize = 14.sp,\n                    lineHeight = 20.sp,\n                )\n            },\n            dismissButton = {\n                TextButton(\n                    onClick = { pendingDeletePhoto = null },\n                    enabled = !photoMutationInProgress,\n                ) { Text("Cancel", color = WorkoutV2Paper) }\n            },\n            confirmButton = {\n                TextButton(\n                    onClick = {\n                        onDeletePhoto(relativePath)\n                        pendingDeletePhoto = null\n                    },\n                    enabled = !photoMutationInProgress,\n                ) { Text("Delete", color = WorkoutV2Delete) }\n            },\n        )\n    }\n}\n\n@Composable\nprivate fun WorkoutV2EditableTextBlock''')

          old_media = '''@Composable\nprivate fun WorkoutV2SetupMediaStrip(paths: List<String>, onAddPhoto: () -> Unit, metrics: WorkoutV2Metrics) {\n    Row(\n        Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()).padding(horizontal = metrics.dp(16)),\n        horizontalArrangement = Arrangement.spacedBy(metrics.dp(10)),\n    ) {\n        MettleControlGlassSurface(\n            modifier = Modifier.width(metrics.dp(56)).height(metrics.dp(196)),\n            shape = RoundedCornerShape(metrics.dp(25)),\n            tint = WorkoutV2Cyan.copy(alpha = .035f),\n            baseColor = WorkoutV2DarkCyan.copy(alpha = .20f),\n            borderColor = WorkoutV2Cyan.copy(alpha = .32f),\n            onClick = onAddPhoto,\n        ) {\n            Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {\n                Text("+", color = WorkoutV2Paper, fontSize = metrics.sp(24), fontWeight = FontWeight.Medium)\n            }\n        }\n        paths.forEach { WorkoutV2SetupMediaImage(it, metrics) }\n        if (paths.isEmpty()) {\n            Surface(\n                modifier = Modifier.width(metrics.dp(252)).height(metrics.dp(196)),\n                shape = RoundedCornerShape(metrics.dp(25)),\n                color = Color.White.copy(alpha = .035f),\n            ) {\n                Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {\n                    Text("Setup photos", color = WorkoutV2Muted)\n                }\n            }\n        }\n    }\n}\n\n@Composable\nprivate fun WorkoutV2SetupMediaImage(relativePath: String, metrics: WorkoutV2Metrics) {\n    val context = LocalContext.current\n    val bitmap by produceState<android.graphics.Bitmap?>(null, relativePath) {\n        value = withContext(Dispatchers.IO) {\n            val direct = File(relativePath)\n            val candidate = if (direct.isAbsolute) direct else File(context.filesDir, relativePath)\n            if (candidate.isFile) BitmapFactory.decodeFile(candidate.absolutePath) else null\n        }\n    }\n    Surface(\n        modifier = Modifier.width(metrics.dp(252)).height(metrics.dp(196)),\n        shape = RoundedCornerShape(metrics.dp(25)),\n        color = Color.White.copy(alpha = .04f),\n    ) {\n        if (bitmap != null) {\n            Image(bitmap!!.asImageBitmap(), null, Modifier.fillMaxSize(), contentScale = ContentScale.Crop)\n        } else {\n            Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { Text("Setup photo", color = WorkoutV2Muted) }\n        }\n    }\n}\n'''
          new_media = '''@Composable\nprivate fun WorkoutV2SetupMediaStrip(\n    paths: List<String>,\n    editMode: Boolean,\n    mutationInProgress: Boolean,\n    onAddPhoto: () -> Unit,\n    onRequestDelete: (String) -> Unit,\n    metrics: WorkoutV2Metrics,\n) {\n    Row(\n        Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()).padding(horizontal = metrics.dp(16)),\n        horizontalArrangement = Arrangement.spacedBy(metrics.dp(10)),\n    ) {\n        MettleControlGlassSurface(\n            modifier = Modifier.width(metrics.dp(56)).height(metrics.dp(196)),\n            shape = RoundedCornerShape(metrics.dp(25)),\n            tint = WorkoutV2Cyan.copy(alpha = .035f),\n            baseColor = WorkoutV2DarkCyan.copy(alpha = .20f),\n            enabled = !mutationInProgress,\n            borderColor = WorkoutV2Cyan.copy(alpha = .32f),\n            onClick = if (mutationInProgress) null else onAddPhoto,\n        ) {\n            Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {\n                Text(\n                    "+",\n                    color = WorkoutV2Paper.copy(alpha = if (mutationInProgress) .38f else 1f),\n                    fontSize = metrics.sp(24),\n                    fontWeight = FontWeight.Medium,\n                )\n            }\n        }\n        paths.forEach { relativePath ->\n            WorkoutV2SetupMediaImage(\n                relativePath = relativePath,\n                editMode = editMode,\n                mutationInProgress = mutationInProgress,\n                onRequestDelete = { onRequestDelete(relativePath) },\n                metrics = metrics,\n            )\n        }\n        if (paths.isEmpty()) {\n            Surface(\n                modifier = Modifier.width(metrics.dp(252)).height(metrics.dp(196)),\n                shape = RoundedCornerShape(metrics.dp(25)),\n                color = Color.White.copy(alpha = .035f),\n            ) {\n                Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {\n                    Text("Setup photos", color = WorkoutV2Muted)\n                }\n            }\n        }\n    }\n}\n\n@Composable\nprivate fun WorkoutV2SetupMediaImage(\n    relativePath: String,\n    editMode: Boolean,\n    mutationInProgress: Boolean,\n    onRequestDelete: () -> Unit,\n    metrics: WorkoutV2Metrics,\n) {\n    val context = LocalContext.current\n    val bitmap by produceState<android.graphics.Bitmap?>(null, relativePath) {\n        value = withContext(Dispatchers.IO) {\n            val direct = File(relativePath)\n            val candidate = if (direct.isAbsolute) direct else File(context.filesDir, relativePath)\n            if (candidate.isFile) BitmapFactory.decodeFile(candidate.absolutePath) else null\n        }\n    }\n    Box(Modifier.width(metrics.dp(252)).height(metrics.dp(196))) {\n        Surface(\n            modifier = Modifier.fillMaxSize(),\n            shape = RoundedCornerShape(metrics.dp(25)),\n            color = Color.White.copy(alpha = .04f),\n        ) {\n            if (bitmap != null) {\n                Image(bitmap!!.asImageBitmap(), null, Modifier.fillMaxSize(), contentScale = ContentScale.Crop)\n            } else {\n                Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {\n                    Text("Setup photo", color = WorkoutV2Muted)\n                }\n            }\n        }\n        if (editMode) {\n            MettleControlGlassSurface(\n                modifier = Modifier\n                    .align(Alignment.TopEnd)\n                    .padding(metrics.dp(8))\n                    .size(metrics.dp(36)),\n                shape = CircleShape,\n                tint = WorkoutV2Delete.copy(alpha = .08f),\n                baseColor = WorkoutV2Ink.copy(alpha = .48f),\n                enabled = !mutationInProgress,\n                borderWidth = metrics.dp(.55),\n                borderColor = WorkoutV2Delete.copy(alpha = .62f),\n                shadowElevation = metrics.dp(4),\n                onClick = if (mutationInProgress) null else onRequestDelete,\n            ) {\n                Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {\n                    Icon(\n                        MettleIcons.Close,\n                        contentDescription = "Delete setup photo",\n                        tint = WorkoutV2Delete.copy(alpha = if (mutationInProgress) .38f else 1f),\n                        modifier = Modifier.size(metrics.dp(18)),\n                    )\n                }\n            }\n        }\n    }\n}\n'''
          replace_once(p, old_media, new_media)

          # Screen wiring.
          p = 'app/src/main/java/dev/kian/mymettle/ui/TrainScreen.kt'
          replace_once(p,
          '''        onAddSetupPhoto = ::openSetupCamera,\n        onSaveSetupDetails = viewModel::saveWorkoutSetup,''',
          '''        onAddSetupPhoto = ::openSetupCamera,\n        onDeleteSetupPhoto = viewModel::deleteSetupPhoto,\n        onSaveSetupDetails = viewModel::saveWorkoutSetup,''')

          # ViewModel mutation, reusing savingSetupPhoto so camera/delete cannot race one another.
          p = 'app/src/main/java/dev/kian/mymettle/ui/N2WorkoutViewModel.kt'
          marker = '''    fun selectMode(mode: TrainingMode) {'''
          method = '''    fun deleteSetupPhoto(exercise: ActiveWorkoutExercise, relativePath: String) {\n        if (uiState.savingSetupPhoto) return\n        viewModelScope.launch {\n            uiState = uiState.copy(savingSetupPhoto = true, error = null)\n            runCatching {\n                libraryRepository.deleteSetupPhoto(exercise.entity.exerciseId, relativePath)\n                repository.activeWorkout()\n            }.onSuccess { refreshed ->\n                uiState = uiState.copy(\n                    savingSetupPhoto = false,\n                    workout = refreshed ?: uiState.workout,\n                )\n            }.onFailure { error ->\n                uiState = uiState.copy(savingSetupPhoto = false)\n                showError(error)\n            }\n        }\n    }\n\n'''
          replace_once(p, marker, method + marker)

          # Repository lookup by the path already carried by ActiveWorkoutExercise.details.
          p = 'app/src/main/java/dev/kian/mymettle/library/ExerciseLibraryRepository.kt'
          marker = '''    private suspend fun load(entity: ExerciseEntity): Exercise {'''
          method = '''    suspend fun deleteSetupPhoto(exerciseId: String, relativePath: String): Exercise {\n        val media = dao.setupMedia(exerciseId)\n            .firstOrNull { it.relativePath == relativePath }\n            ?: throw NativeWorkoutException("Setup photo not found.")\n        database.withTransaction {\n            dao.deleteSetupMedia(media.id)\n            dao.setupMedia(exerciseId).forEachIndexed { index, remaining ->\n                if (remaining.sortOrder != index) {\n                    dao.upsertSetupMedia(remaining.copy(sortOrder = index))\n                }\n            }\n        }\n        withContext(Dispatchers.IO) { File(context.filesDir, media.relativePath).delete() }\n        return exercise(exerciseId)\n    }\n\n'''
          replace_once(p, marker, method + marker)
          PY

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "Magna-Create"
          git config user.email "53941598+Magna-Create@users.noreply.github.com"
          git add app/src/main/java/dev/kian/mymettle/ui/WorkoutExitOverlay.kt \
                  app/src/main/java/dev/kian/mymettle/ui/MyMettleApp.kt \
                  app/src/main/java/dev/kian/mymettle/ui/FigmaWorkoutSessionV2.kt \
                  app/src/main/java/dev/kian/mymettle/ui/TrainScreen.kt \
                  app/src/main/java/dev/kian/mymettle/ui/N2WorkoutViewModel.kt \
                  app/src/main/java/dev/kian/mymettle/library/ExerciseLibraryRepository.kt
          git commit -m "Rebuild exit workout UX and add setup photo deletion"
          git push origin HEAD:agent/workout-ui-nbio6-upgrade
