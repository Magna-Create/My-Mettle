name: Patch glass header targets

on:
  push:
    branches:
      - agent/figma-home-daily-update
    paths:
      - .github/workflows/patch-glass-header-targets.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/figma-home-daily-update
          fetch-depth: 0

      - name: Patch header touch targets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f'{label} replacement count={count}')
              return updated

          daily_path = Path('app/src/main/java/dev/kian/mymettle/ui/FigmaDailyUpdate.kt')
          daily = daily_path.read_text(encoding='utf-8')

          daily = replace_once(
              daily,
              r'\.width\(metrics\.dp\(81\)\)\s*\n\s*\.height\(metrics\.dp\(49\.388\)\),',
              '.width(metrics.dp(96))\n                .height(metrics.dp(52)),',
              'Daily capsule size',
          )
          daily = replace_once(
              daily,
              r'modifier = Modifier\s*\n\s*\.fillMaxSize\(\)\s*\n\s*\.padding\(horizontal = metrics\.dp\(6\.1735\)\),\s*\n\s*horizontalArrangement = Arrangement\.spacedBy\(metrics\.dp\(3\.08675\)\),',
              'modifier = Modifier.fillMaxSize(),\n                horizontalArrangement = Arrangement.SpaceBetween,',
              'Daily header row',
          )
          daily = replace_once(
              daily,
              r'@Composable\nprivate fun FigmaHeaderIconButton\(.*?\n}\n\n@Composable\nprivate fun FigmaHeroGreeting',
              '''@Composable
private fun FigmaHeaderIconButton(
    imageVector: androidx.compose.ui.graphics.vector.ImageVector,
    contentDescription: String,
    onClick: () -> Unit,
    metrics: FigmaMetrics,
) {
    MettleGlassIconTouchTarget(
        modifier = Modifier
            .width(metrics.dp(48))
            .fillMaxHeight(),
        imageVector = imageVector,
        contentDescription = contentDescription,
        onClick = onClick,
        iconSize = DpSize(metrics.dp(16.3916), metrics.dp(16.3916)),
        contentAlpha = 0.80f,
        pressedHaloSize = metrics.dp(36),
    )
}

@Composable
private fun FigmaHeroGreeting''',
              'Daily header target',
              flags=re.S,
          )
          daily_path.write_text(daily, encoding='utf-8')

          intensity_path = Path('app/src/main/java/dev/kian/mymettle/ui/FigmaIntensitySelectorV3.kt')
          intensity = intensity_path.read_text(encoding='utf-8')
          if 'import androidx.compose.ui.unit.DpSize\n' not in intensity:
              intensity = intensity.replace(
                  'import androidx.compose.ui.unit.Dp\n',
                  'import androidx.compose.ui.unit.Dp\nimport androidx.compose.ui.unit.DpSize\n',
                  1,
              )

          intensity = replace_once(
              intensity,
              r'\.width\(metrics\.dp\(81\)\)\s*\n\s*\.height\(metrics\.dp\(49\.388\)\),',
              '.width(metrics.dp(96))\n                .height(metrics.dp(52)),',
              'Intensity capsule size',
          )
          intensity = replace_once(
              intensity,
              r'modifier = Modifier\s*\n\s*\.fillMaxSize\(\)\s*\n\s*\.padding\(horizontal = metrics\.dp\(6\.17\)\),\s*\n\s*horizontalArrangement = Arrangement\.spacedBy\(metrics\.dp\(3\.09\)\),',
              'modifier = Modifier.fillMaxSize(),\n                horizontalArrangement = Arrangement.SpaceBetween,',
              'Intensity header row',
          )
          intensity = replace_once(
              intensity,
              r'@Composable\nprivate fun IntensityV3HeaderIcon\(.*?\n}\n\n@Composable\nprivate fun IntensityV3ModeCopy',
              '''@Composable
private fun IntensityV3HeaderIcon(
    imageVector: androidx.compose.ui.graphics.vector.ImageVector,
    contentDescription: String,
    onClick: () -> Unit,
    metrics: IntensityV3Metrics,
) {
    MettleGlassIconTouchTarget(
        modifier = Modifier
            .width(metrics.dp(48))
            .fillMaxHeight(),
        imageVector = imageVector,
        contentDescription = contentDescription,
        onClick = onClick,
        iconSize = DpSize(metrics.dp(16.39), metrics.dp(16.39)),
        contentAlpha = 0.82f,
        pressedHaloSize = metrics.dp(36),
    )
}

@Composable
private fun IntensityV3ModeCopy''',
              'Intensity header target',
              flags=re.S,
          )
          intensity_path.write_text(intensity, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/dev/kian/mymettle/ui/FigmaDailyUpdate.kt app/src/main/java/dev/kian/mymettle/ui/FigmaIntensitySelectorV3.kt
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Fix glass header touch targets'
          git push origin HEAD:agent/figma-home-daily-update
