name: Patch N-BIO-7C finite-range compile fix

on:
  push:
    branches:
      - "agent/n-bio-vnext-inference"
    paths:
      - ".github/workflows/patch-nbio7c-min-normal.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/n-bio-vnext-inference
          fetch-depth: 0
      - name: Qualify JVM minimum normal constant
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/dev/kian/mymettle/engine/performance/NonDynamicCapabilityModel.kt')
          text = p.read_text()
          old = 'ln(Double.MIN_NORMAL)'
          if text.count(old) != 1:
              raise SystemExit(f'expected one MIN_NORMAL reference, found {text.count(old)}')
          p.write_text(text.replace(old, 'ln(java.lang.Double.MIN_NORMAL)', 1))
          PY
          git diff --check
      - name: Commit fix and remove workflow
        run: |
          rm .github/workflows/patch-nbio7c-min-normal.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Fix N-BIO-7C finite output guard compile"
          git push origin HEAD:agent/n-bio-vnext-inference
