name: Workout lighting dock patch

on:
  push:
    branches:
      - agent/workout-ui-nbio6-upgrade

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workout-ui-nbio6-upgrade
          fetch-depth: 0
      - name: Patch Kotlin sources
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workout = Path("app/src/main/java/dev/kian/mymettle/ui/FigmaWorkoutSessionV2.kt")
          text = workout.read_text()
          if "import androidx.compose.foundation.layout.requiredSize\n" not in text:
              text = text.replace("import androidx.compose.foundation.layout.padding\n", "import androidx.compose.foundation.layout.padding\nimport androidx.compose.foundation.layout.requiredSize\n", 1)
          if "import androidx.compose.ui.zIndex\n" not in text:
              text = text.replace("import androidx.compose.ui.unit.sp\n", "import androidx.compose.ui.unit.sp\nimport androidx.compose.ui.zIndex\n", 1)

          old = '''        if (isCurrent) {
            Box(
                Modifier
                .size(metrics.dp(104))
                .align(Alignment.CenterStart)
                .blur(
                    radius = metrics.dp(40),
                    edgeTreatment = BlurredEdgeTreatment.Unbounded,
                )
                .background(WorkoutV2Cyan.copy(alpha = .20f), CircleShape),
            )
        }
'''
          new = '''        if (isCurrent) {
            // Oversized active-set illumination: the old blurred child sat behind the metric
            // glass and was visually clipped to the set-number cell on device. This radial field
            // is deliberately larger than the row and drawn above it, so fall-off continues
            // naturally across load/reps and slightly beyond the row boundaries.
            Canvas(
                Modifier
                    .requiredSize(metrics.dp(280))
                    .align(Alignment.CenterStart)
                    .zIndex(1f),
            ) {
                val centre = Offset(metrics.dp(47).toPx(), size.height / 2f)
                val radius = metrics.dp(140).toPx()
                drawCircle(
                    brush = Brush.radialGradient(
                        colorStops = arrayOf(
                            0f to WorkoutV2Cyan.copy(alpha = .12f),
                            .28f to WorkoutV2Cyan.copy(alpha = .075f),
                            .58f to WorkoutV2Cyan.copy(alpha = .032f),
                            1f to Color.Transparent,
                        ),
                        center = centre,
                        radius = radius,
                    ),
                    center = centre,
                    radius = radius,
                )
            }
        }
'''
          if old not in text:
              raise SystemExit("workout light source mismatch")
          workout.write_text(text.replace(old, new, 1))

          intensity = Path("app/src/main/java/dev/kian/mymettle/ui/FigmaIntensitySelectorV3.kt")
          text = intensity.read_text()
          old = '''    // Same home marker as the workout-exit surface: quiet fill, outer definition ring,
    // then one smaller inner ring. Deliberately no third concentric treatment.
    Canvas(modifier = Modifier.size(metrics.dp(48))) {
        drawCircle(Color.White.copy(alpha = .045f))
        drawCircle(
            MettleOnSurface.copy(alpha = .68f),
            style = Stroke(metrics.dp(.8).toPx()),
        )
        drawCircle(
            MettleOnSurface.copy(alpha = .34f),
            radius = size.minDimension * .22f,
            style = Stroke(metrics.dp(.65).toPx()),
        )
    }
'''
          new = '''    // Match the workout-exit dock as it actually reads on-device: one outer definition
    // ring and one smaller home ring. The selector's brighter field made the previous translucent
    // disc read as an unwanted third concentric circle.
    Canvas(modifier = Modifier.size(metrics.dp(48))) {
        drawCircle(
            Color(0xFFE1E4DA).copy(alpha = .68f),
            style = Stroke(metrics.dp(.8).toPx()),
        )
        drawCircle(
            Color(0xFFE1E4DA).copy(alpha = .34f),
            radius = size.minDimension * .22f,
            style = Stroke(metrics.dp(.65).toPx()),
        )
    }
'''
          if old not in text:
              raise SystemExit("intensity dock source mismatch")
          intensity.write_text(text.replace(old, new, 1))

          Path(".github/workflows/workout-lighting-dock-once.yml").unlink()
          PY
          git config user.name "Magna-Create"
          git config user.email "53941598+Magna-Create@users.noreply.github.com"
          git add -A
          git commit -m "Fix workout set lighting and simplify intensity dock"
          git push origin HEAD:agent/workout-ui-nbio6-upgrade
