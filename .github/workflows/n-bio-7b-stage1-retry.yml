name: N-BIO-7B Stage1 Retry

on:
  push:
    branches:
      - agent/n-bio-vnext-inference
    paths:
      - .github/workflows/n-bio-7b-stage1-retry.yml

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android SDK 37
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Apply corrected Stage-1 patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/n-bio-7b-stage1-patch.yml').read_text()
          marker = "          python3 <<'PY'\n"
          end = "\n          PY\n          git diff --check"
          script = workflow.split(marker, 1)[1].split(end, 1)[0]
          script = textwrap.dedent(script)
          script = script.replace(
              "'''        require(benchmarkLatestResistanceAnchorKg == null || benchmarkLatestResistanceAnchorKg > 0.0)\n    if (status == DynamicHeldOutStatus.MODEL_FAILURE) require(!modelFailureReason.isNullOrBlank())''',",
              "'''        require(benchmarkLatestResistanceAnchorKg == null || benchmarkLatestResistanceAnchorKg > 0.0)\n        if (status == DynamicHeldOutStatus.MODEL_FAILURE) require(!modelFailureReason.isNullOrBlank())''',",
          )
          script = script.replace(
              "'''        require(benchmarkLatestResistanceAnchorKg == null || benchmarkLatestResistanceAnchorKg > 0.0)\n    require(candidateCrpsLogResistance == null || (candidateCrpsLogResistance.isFinite() && candidateCrpsLogResistance >= 0.0))\n    if (status == DynamicHeldOutStatus.EVALUABLE) require(candidateFrontierAtRepetitions != null)\n    if (status == DynamicHeldOutStatus.MODEL_FAILURE) require(!modelFailureReason.isNullOrBlank())''')",
              "'''        require(benchmarkLatestResistanceAnchorKg == null || benchmarkLatestResistanceAnchorKg > 0.0)\n        require(candidateCrpsLogResistance == null || (candidateCrpsLogResistance.isFinite() && candidateCrpsLogResistance >= 0.0))\n        if (status == DynamicHeldOutStatus.MODEL_FAILURE) require(!modelFailureReason.isNullOrBlank())''')",
          )
          compile(script, '<stage1-patch>', 'exec')
          exec(script, {'__builtins__': __builtins__})
          Path('.github/workflows/n-bio-7b-stage1-retry.yml').unlink()
          PY
          git diff --check
      - name: Focused Stage-1 tests and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Compile instrumentation APK
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace --no-daemon
      - name: Commit corrected tree
        shell: bash
        run: |
          git config user.name 'Magna-Create'
          git config user.email '53941598+Magna-Create@users.noreply.github.com'
          git add -A
          git commit -m 'Add N-BIO-7B Candidate-v1 temporal diagnostics'
          git push origin HEAD:agent/n-bio-vnext-inference
