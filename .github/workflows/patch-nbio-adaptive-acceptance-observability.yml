name: Patch N-BIO adaptive acceptance observability

on:
  push:
    branches:
      - "agent/n-bio-vnext-inference"
    paths:
      - ".github/workflows/patch-nbio-adaptive-acceptance-observability.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout live N-BIO-7B.X branch
        uses: actions/checkout@v4
        with:
          ref: agent/n-bio-vnext-inference
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply bounded acceptance patch
        run: python3 scripts/patch_nbio_adaptive_acceptance_observability.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Verify validated numerical-domain guard remains present
        shell: bash
        run: |
          grep -Fq 'Conditional-Laplace Candidate-v2 projection left the configured numerical resistance domain; approximation is unavailable for this horizon.' \
            app/src/main/java/dev/kian/mymettle/engine/performance/DynamicTrendFrontierModel.kt

      - name: Unit build instrumentation compile and lint regressions
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --stacktrace --no-daemon

      - name: Verify Room14 remains exported
        shell: bash
        run: |
          test -f app/schemas/dev.kian.mymettle.data.local.MyMettleDatabase/14.json
          grep -q '"version": 14' app/schemas/dev.kian.mymettle.data.local.MyMettleDatabase/14.json

      - name: Commit bounded N-BIO-7B.X patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            app/src/main/java/dev/kian/mymettle/domain/inference/DynamicTrendFrontierV2.kt \
            app/src/main/java/dev/kian/mymettle/engine/performance/DynamicTrendFrontierModel.kt \
            app/src/main/java/dev/kian/mymettle/engine/inference/DynamicTrendSolverAdapters.kt \
            app/src/main/java/dev/kian/mymettle/inference/DynamicTrendCapabilityParameterCodec.kt \
            app/src/main/java/dev/kian/mymettle/developer/NBioAdaptiveRuntimeTelemetry.kt \
            app/src/main/java/dev/kian/mymettle/developer/NBioAdaptiveInferenceAcceptance.kt \
            app/src/test/java/dev/kian/mymettle/engine/performance/DynamicTrendFrontierModelTest.kt \
            app/src/test/java/dev/kian/mymettle/inference/DynamicTrendCapabilityParameterCodecTest.kt \
            docs/n-bio-vnext/NBIO_7BX_ADAPTIVE_ACCEPTANCE_CHECKPOINT_2026-09-01.md
          git commit -m "Correct N-BIO adaptive acceptance observability"
          git push origin HEAD:agent/n-bio-vnext-inference

      - name: Remove accidental temporary refs
        if: success()
        shell: bash
        run: |
          git push origin --delete agent/n-bio-vnext-inference-harness-temp || true
          git push origin --delete agent/n-bio-vnext-inference-observability-bootstrap || true
