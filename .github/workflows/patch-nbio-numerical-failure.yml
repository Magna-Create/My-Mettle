name: Patch N-BIO numerical failure handling

on:
  push:
    branches:
      - "agent/n-bio-vnext-inference"
    paths:
      - ".github/workflows/patch-nbio-numerical-failure.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/n-bio-vnext-inference
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Apply patch
        run: python3 scripts/patch_nbio_numerical_failure.py
      - name: Verify patch
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --stacktrace --no-daemon
      - name: Commit product patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            app/src/main/java/dev/kian/mymettle/engine/performance/DynamicTrendFrontierModel.kt \
            app/src/main/java/dev/kian/mymettle/engine/inference/DynamicTrendPosteriorFidelity.kt \
            app/src/main/java/dev/kian/mymettle/developer/NBioAdaptiveInferenceAcceptance.kt \
            app/src/test/java/dev/kian/mymettle/engine/performance/DynamicTrendFrontierModelTest.kt \
            app/src/test/java/dev/kian/mymettle/engine/inference/DynamicTrendPosteriorFidelityTest.kt
          git commit -m "Fail closed on unstable Candidate-v2 projections"
          git push origin HEAD:agent/n-bio-vnext-inference
