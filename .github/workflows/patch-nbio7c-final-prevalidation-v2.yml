name: Patch N-BIO-7C prevalidation blockers v2

on:
  push:
    branches:
      - "agent/n-bio-vnext-inference"
    paths:
      - ".github/workflows/patch-nbio7c-final-prevalidation-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/n-bio-vnext-inference
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 37
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Apply bounded patch
        run: python3 scripts/patch_nbio7c_prevalidation.py
      - name: Check patch
        run: |
          git diff --check
          grep -Fq 'containsWithFloatingPointTolerance' app/src/main/java/dev/kian/mymettle/developer/NBio7CSyntheticValidation.kt
          grep -Fq 'private class CodecWriter' app/src/main/java/dev/kian/mymettle/inference/NonDynamicCapabilityParameterCodec.kt
          grep -Fq 'private class CodecReader' app/src/main/java/dev/kian/mymettle/inference/NonDynamicCapabilityParameterCodec.kt
      - name: Focused 7C regressions
        shell: bash
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest \
            --tests 'dev.kian.mymettle.developer.NBio7CSyntheticValidationTest' \
            --tests 'dev.kian.mymettle.inference.NonDynamicCapabilityParameterCodecTest' \
            --stacktrace --no-daemon
          status=$?
          echo '===== focused JUnit XML ====='
          find app/build/test-results/testDebugUnitTest -maxdepth 1 -type f -name '*.xml' -print -exec cat {} \; 2>/dev/null || true
          exit $status
      - name: Full relevant Gradle gate
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug \
            --stacktrace --no-daemon
      - name: Verify Room14
        run: |
          test -f app/schemas/dev.kian.mymettle.data.local.MyMettleDatabase/14.json
          grep -q '"version": 14' app/schemas/dev.kian.mymettle.data.local.MyMettleDatabase/14.json
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/dev/kian/mymettle/inference/NonDynamicCapabilityParameterCodec.kt app/src/main/java/dev/kian/mymettle/developer/NBio7CSyntheticValidation.kt
          git commit -m "Fix N-BIO-7C prevalidation framing"
          git push origin HEAD:agent/n-bio-vnext-inference
