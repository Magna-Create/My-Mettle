name: Apply glass control migration

on:
  push:
    branches:
      - agent/figma-home-daily-update
    paths:
      - .github/workflows/apply-glass-control-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out UI branch
        uses: actions/checkout@v4
        with:
          ref: agent/figma-home-daily-update
          fetch-depth: 0

      - name: Apply shared glass controls
        run: python tools/apply_glass_control_migration.py

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/dev/kian/mymettle/ui
          if git diff --cached --quiet; then
            echo "Migration produced no changes" >&2
            exit 1
          fi
          git commit -m "Apply hotbar glass to interactive controls"
          git push origin HEAD:agent/figma-home-daily-update
