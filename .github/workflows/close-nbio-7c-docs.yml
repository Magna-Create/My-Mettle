name: Close N-BIO-7C structural documentation

on:
  push:
    branches:
      - agent/n-bio-vnext-inference
    paths:
      - .github/workflows/close-nbio-7c-docs.yml

permissions:
  contents: write

jobs:
  close-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/n-bio-vnext-inference
          fetch-depth: 0

      - name: Record physical 7C structural closure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, count))

          # Authoritative plan.
          replace(
              "docs/n-bio-vnext/PLAN.md",
              "Room14 remains sufficient for the completed 7B.X model/solver state and the current 7C capability mission.",
              "Room14 remains sufficient for the completed 7B.X model/solver state and the completed N-BIO-7C structural/pre-validation mission; PD-001 remains open for deferred empirical calibration.",
          )
          replace(
              "docs/n-bio-vnext/PLAN.md",
              "## 13. Current device acceptance gate\n\nThe active consolidated Biological Developer action is:\n\n**Run N-BIO 7C Capability Acceptance**",
              "## 13. Completed N-BIO-7C device acceptance gate\n\nThe consolidated Biological Developer action used for physical 7C structural closure was:\n\n**Run N-BIO 7C Capability Acceptance**",
          )
          replace(
              "docs/n-bio-vnext/PLAN.md",
              "The gate may establish structural closure only. Under PD-001, insufficient real longitudinal evidence remains `EMPIRICAL_ACCURACY_PENDING` / `NOT_EVALUATED_REAL_HISTORY`; synthetic recovery or structural success must not be relabelled as empirical human calibration.",
              "The physical gate established structural closure only. Under PD-001, insufficient real longitudinal evidence remains `EMPIRICAL_ACCURACY_PENDING` / `NOT_EVALUATED_REAL_HISTORY`; synthetic recovery or structural success must not be relabelled as empirical human calibration. The accepted physical checkpoint is preserved in [`NBIO_7C_CAPABILITY_ACCEPTANCE_CHECKPOINT_2026-09-02.md`](./NBIO_7C_CAPABILITY_ACCEPTANCE_CHECKPOINT_2026-09-02.md).",
          )
          replace(
              "docs/n-bio-vnext/PLAN.md",
              "Room remains **14** through the current N-BIO-7C mission unless a genuine semantic impossibility is demonstrated.",
              "Room remains **14** through the completed N-BIO-7C structural/pre-validation mission unless a genuine semantic impossibility is demonstrated.",
          )
          replace(
              "docs/n-bio-vnext/PLAN.md",
              "N-BIO-7C   ACTIVE — loaded-hold, duration-only and repeated-contraction structural/pre-validation under NON_DYNAMIC_CAPABILITY_CONTRACT.md\nPD-001     OPEN — empirical human calibration postponed where longitudinal evidence is insufficient; downstream quarantine remains binding\nlater 7D–7G retain their intended product/domain destinations and must consume the corrected inference/7C contracts without treating PD-001 as a pass",
              "N-BIO-7C   complete structural/pre-validation — loaded-hold, duration-only and repeated-contraction contracts accepted physically; numerical outputs remain SHADOW under PD-001\nPD-001     OPEN — empirical human calibration postponed where longitudinal evidence is insufficient; downstream quarantine remains binding\nN-BIO-7D   NOT STARTED — next-phase work requires explicit instruction and must consume 7C contracts without treating PD-001 as a pass\nlater 7E–7G retain their intended product/domain destinations under the same quarantine",
          )

          # 7C normative contract.
          replace(
              "docs/n-bio-vnext/NON_DYNAMIC_CAPABILITY_CONTRACT.md",
              "Status: **N-BIO-7C ACTIVE — structural/pre-validation implementation; empirical calibration quarantined by PD-001.**",
              "Status: **N-BIO-7C STRUCTURAL/PRE-VALIDATION COMPLETE — physical acceptance PASS; empirical calibration remains quarantined by open PD-001. N-BIO-7D has not started.**",
          )
          replace(
              "docs/n-bio-vnext/NON_DYNAMIC_CAPABILITY_CONTRACT.md",
              "N-BIO-7D SetDemand/dose work and every later biological/translation/conditioning/V8 feature remain strictly out of scope while this 7C mission is active.",
              "N-BIO-7D SetDemand/dose work and every later biological/translation/conditioning/V8 feature remained strictly out of scope for the 7C mission. Structural closure does not itself authorise or start N-BIO-7D.",
          )
          replace(
              "docs/n-bio-vnext/NON_DYNAMIC_CAPABILITY_CONTRACT.md",
              "N-BIO-7D is not authorised until this amended 7C structural closure is complete.",
              "N-BIO-7C structural closure is complete. PD-001 remains open and binding; N-BIO-7D has not started and requires explicit next-phase instruction.",
          )

          # Documentation map / current status.
          replace(
              "docs/n-bio-vnext/README.md",
              "7C      ACTIVE — host structural/pre-validation gate green; installed Room14 capability acceptance pending; PD-001 empirical accuracy pending where evidence is insufficient",
              "7C      complete structural/pre-validation — physical Room14 capability acceptance PASS; PD-001 empirical accuracy remains pending where evidence is insufficient\n7D      NOT STARTED — requires explicit next-phase instruction",
          )
          replace(
              "docs/n-bio-vnext/README.md",
              "## Product and safety authority during 7B.X",
              "## Current product and safety authority",
          )
          replace(
              "docs/n-bio-vnext/README.md",
              "- N-BIO-7C exercise-family capability work is not authorised by 7B.X.",
              "- N-BIO-7C numerical outputs remain SHADOW/developer-only under PD-001 and are not normal-user prescription or prefill authority.",
          )
          replace(
              "docs/n-bio-vnext/README.md",
              "N-BIO-7C remains active until the installed Room14 capability acceptance is recorded; N-BIO-7D has not started.",
              "N-BIO-7C structural/pre-validation is complete after physical Room14 acceptance. PD-001 remains open; N-BIO-7D has not started.",
          )

          # Older detailed/status documents should not claim 7C is still active.
          replace(
              "docs/n-bio-vnext/CORE_MODEL_DETAIL.md",
              "Forward model implementation order (with same-profile capability now active in N-BIO-7C):",
              "Forward model implementation order (with same-profile capability structurally closed in N-BIO-7C under open PD-001):",
          )
          replace(
              "docs/n-bio-vnext/DYNAMIC_RESISTANCE_CAPABILITY_CONTRACT.md",
              "Status: **Candidate v1 frozen/rejected; N-BIO-7B.X adaptive-inference consolidation complete. Adaptive Sparse is the selected forward Candidate-v2 solver, Dense is retained as the bounded high-fidelity oracle, Conditional Laplace is rejected for production, and N-BIO-7C is active under PD-001.**",
              "Status: **Candidate v1 frozen/rejected; N-BIO-7B.X adaptive-inference consolidation complete. Adaptive Sparse is the selected forward Candidate-v2 solver, Dense is retained as the bounded high-fidelity oracle, Conditional Laplace is rejected for production, and N-BIO-7C structural/pre-validation is complete with PD-001 still open.**",
          )
          replace(
              "docs/n-bio-vnext/DYNAMIC_RESISTANCE_CAPABILITY_CONTRACT.md",
              "N-BIO-7B.X is complete. N-BIO-7C is the active consolidated capability-family mission under PD-001; N-BIO-7D has not started.",
              "N-BIO-7B.X is complete. N-BIO-7C structural/pre-validation is also complete; PD-001 remains open and N-BIO-7D has not started.",
          )

          checkpoint = Path("docs/n-bio-vnext/NBIO_7C_CAPABILITY_ACCEPTANCE_CHECKPOINT_2026-09-02.md")
          checkpoint.write_text("""# N-BIO-7C capability physical checkpoint — 2026-09-02

This checkpoint records the physical installed-device acceptance for the consolidated **N-BIO-7C** capability-family mission covering `LOADED_HOLD`, `DURATION_ONLY` and `REPEATED_CONTRACTION`.

It closes the **structural/pre-validation** mission only. It does not claim empirical human calibration, does not promote any 7C numerical output to normal-user authority, and does not start N-BIO-7D.

## Physical report

- format: `my-mettle-n-bio-7c-capability-acceptance`
- format version: `1`
- generated: `2026-09-02T12:58:12.460033Z`
- app: `0.1.0-alpha28-dev` / version code `27`
- device class: Samsung Android SDK 36 physical handset
- Room schema: `14`
- total acceptance runtime: `2792 ms`

The full exported personal acceptance JSON is intentionally **not committed to this public repository**. This checkpoint records only the privacy-bounded engineering/scientific verdict needed for project provenance.

## Verdict

```text
structuralPrevalidation = PASS
empiricalAccuracy       = EMPIRICAL_ACCURACY_PENDING
overall7C               = READY_FOR_7C_STRUCTURAL_CLOSURE_EMPIRICAL_ACCURACY_PENDING
```

Therefore:

**N-BIO-7C STRUCTURAL/PRE-VALIDATION: COMPLETE.**

**PD-001: OPEN.**

**N-BIO-7D: NOT STARTED.**

## Family gate

All three family contracts passed structural pre-validation:

- `LOADED_HOLD`: PASS;
- `DURATION_ONLY`: PASS;
- `REPEATED_CONTRACTION`: PASS.

Installed history was sufficient to exercise a real duration-only profile through the structural persistence/replay path. Loaded-hold and repeated-contraction did not have suitable current real-history evidence, so those family empirical statuses remain `NOT_EVALUATED_REAL_HISTORY`. The duration-only family remains `EMPIRICAL_ACCURACY_PENDING` rather than being mislabelled as calibrated from sparse history.

No missing history was fabricated to make the gate pass.

## Synthetic latent-truth pre-validation

The synthetic protocol `n-bio-7c-synthetic-latent-truth-v1` passed all 15 declared cases: stable, upward, downward, sparse and numerical-stress scenarios for each of the three capability families.

Every exported recovery/invariant check was true. The cases established implementation-level recovery against the declared candidate mathematics, including directionality where identifiable, broad/neutral behaviour under sparse histories, finite stress projections, widening out-of-domain/horizon uncertainty and Sparse-vs-Dense fidelity.

This evidence class remains explicitly:

`SYNTHETIC_LATENT_TRUTH_PREVALIDATION_NOT_EMPIRICAL_HUMAN_ACCURACY`

It is not evidence that the chosen priors, slopes, noise/slack assumptions or process dynamics are physiologically calibrated in humans.

## Adaptive Sparse versus Dense

Dense remains the high-fidelity deterministic reference/oracle and Adaptive Sparse remains the forward inference representation inherited from the completed 7B.X solver decision.

The physical synthetic comparison was strong:

- duration-only Sparse and Dense agreed to floating-point precision in the declared fixtures;
- loaded-hold worst exported query-tail relative error was about `0.000976` (~`0.098%`), with worst positive-trajectory probability absolute error about `0.000061`;
- repeated-contraction was the least exact but still passed the pre-registered fidelity gate: worst query-tail relative error about `0.01457` (~`1.46%`) and worst positive-trajectory probability absolute error about `0.00408`.

The largest observed Sparse approximation discrepancy therefore remains bounded, visible and family-specific rather than being hidden as exact equality.

## Persistence, replay and backup safety

The installed-history 7C path passed all required disposable-derived-state checks:

- persist/reload equivalent;
- delete-derived confirmed;
- deterministic full replay equivalent;
- mathematical-model and solver identities retained through persistence;
- Room14 Native backup/restore candidate rows matched;
- raw-evidence state matched through round-trip;
- prescription state matched through round-trip;
- foreign keys were clean.

The acceptance reported no numerical failure for the installed-history profile.

## Product and evidence integrity

Safety/product invariants remained intact:

- raw evidence unchanged;
- prescription state unchanged;
- `BENCHMARK_V0` authority unchanged;
- Candidate-v2 dynamic-resistance foundation remained the frozen 7B.X decision;
- 7C remained SHADOW/developer-only;
- PD-001 downstream quarantine remained present in the exported report;
- N-BIO-7D was not started.

No 7C finite posterior is therefore authorised as normal workout prescription, prefill or downstream empirical truth.

## Closure interpretation

The 7C architecture has now earned what the amended contract allowed it to earn without inventing evidence: family separation, typed semantics, versioned mathematics, deterministic solver provenance, synthetic recovery, bounded Sparse fidelity, persistence/replay safety, Room14 backup safety and product-authority isolation.

What it has **not** earned is real-human calibration of the three family-specific numerical models. That work remains deliberately postponed under **PD-001** until sufficient semantically valid longitudinal personal or external evidence exists. Downstream phases may consume the 7C interfaces/contracts but must not treat these numerical outputs as empirically validated truth while PD-001 is open.

This checkpoint does not authorise the next roadmap phase automatically.
""")
          PY

      - name: Commit closure docs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/n-bio-vnext
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Close N-BIO-7C structural pre-validation"
          git push origin HEAD:agent/n-bio-vnext-inference
