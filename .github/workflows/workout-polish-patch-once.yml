name: Workout polish patch once

on:
  push:
    branches:
      - agent/workout-ui-nbio6-upgrade
    paths:
      - ".github/workflows/workout-polish-patch-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workout-ui-nbio6-upgrade
          fetch-depth: 0

      - name: Patch workout lighting and intensity dock
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          workout = Path("app/src/main/java/dev/kian/mymettle/ui/FigmaWorkoutSessionV2.kt")
          text = workout.read_text()

          old_import = "import androidx.compose.ui.Modifier\nimport androidx.compose.ui.draw.blur\n"
          new_import = "import androidx.compose.ui.Modifier\nimport androidx.compose.ui.draw.BlurredEdgeTreatment\nimport androidx.compose.ui.draw.blur\n"
          assert old_import in text, "Workout blur import anchor not found"
          text = text.replace(old_import, new_import, 1)

          section_start = text.index("    val rowHeight = if (standardTwoMetricLayout) {")
          section_end = text.index("\n@Composable\nprivate fun WorkoutV2MetricField", section_start)
          section = text[section_start:section_end]

          shell_pattern = re.compile(
              r'''Box\(\s*Modifier\s*\.fillMaxWidth\(\)\s*\.height\(rowHeight\)\s*\.clip\(shape\)\s*\.background\(Color\.White\.copy\(alpha = if \(completed\) \.055f else \.025f\)\),\s*\) \{''',
              re.S,
          )
          shell_replacement = '''Box(
              Modifier
                  .fillMaxWidth()
                  .height(rowHeight),
          ) {
              // Keep the structural row clipped, but let the current-set light live outside that
              // clip. The old blurred child was clipped at its own rectangular bounds, creating
              // the hard top/bottom cut-off visible on device.
              Box(
                  Modifier
                      .matchParentSize()
                      .clip(shape)
                      .background(Color.White.copy(alpha = if (completed) .055f else .025f)),
              )'''
          section, count = shell_pattern.subn(shell_replacement, section, count=1)
          assert count == 1, f"Workout row shell matches: {count}"

          glow_pattern = re.compile(
              r'''Modifier\s*\.size\(metrics\.dp\(96\)\)\s*\.align\(Alignment\.CenterStart\)\s*\.blur\(metrics\.dp\(22\)\)\s*\.background\(WorkoutV2Cyan\.copy\(alpha = \.18f\), CircleShape\),''',
              re.S,
          )
          glow_replacement = '''Modifier
                          .size(metrics.dp(104))
                          .align(Alignment.CenterStart)
                          .blur(
                              radius = metrics.dp(40),
                              edgeTreatment = BlurredEdgeTreatment.Unbounded,
                          )
                          .background(WorkoutV2Cyan.copy(alpha = .20f), CircleShape),'''
          section, count = glow_pattern.subn(glow_replacement, section, count=1)
          assert count == 1, f"Workout current glow matches: {count}"

          row_pattern = re.compile(r'''Row\(\s*Modifier\s*\.fillMaxSize\(\)\s*\.mettleDirectionalBorder\(''', re.S)
          row_replacement = '''Row(
                  Modifier
                      .fillMaxSize()
                      .clip(shape)
                      .mettleDirectionalBorder('''
          section, count = row_pattern.subn(row_replacement, section, count=1)
          assert count == 1, f"Workout row content matches: {count}"

          text = text[:section_start] + section + text[section_end:]
          workout.write_text(text)

          intensity = Path("app/src/main/java/dev/kian/mymettle/ui/FigmaIntensitySelectorV3.kt")
          text = intensity.read_text()
          dock_start = text.index("/** The fixed centre dock. It remains visible while the movable glass lens travels away. */")
          dock_end = text.index("/**\n * The actual draggable object", dock_start)
          new_dock = '''/** The fixed centre dock. It remains visible while the movable glass lens travels away. */
          @Composable
          private fun IntensityV3HandleDock(
              metrics: IntensityV3Metrics,
          ) {
              // Same home marker as the workout-exit surface: quiet fill, outer definition ring,
              // then one smaller inner ring. Deliberately no third concentric treatment.
              Canvas(modifier = Modifier.size(metrics.dp(48))) {
                  drawCircle(Color.White.copy(alpha = .045f))
                  drawCircle(
                      MettleOnSurface.copy(alpha = .68f),
                      style = Stroke(metrics.dp(.8).toPx()),
                  )
                  drawCircle(
                      MettleOnSurface.copy(alpha = .34f),
                      radius = size.minDimension * .22f,
                      style = Stroke(metrics.dp(.65).toPx()),
                  )
              }
          }

          '''
          text = text[:dock_start] + new_dock + text[dock_end:]
          intensity.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Magna-Create"
          git config user.email "53941598+Magna-Create@users.noreply.github.com"
          git add app/src/main/java/dev/kian/mymettle/ui/FigmaWorkoutSessionV2.kt \
                  app/src/main/java/dev/kian/mymettle/ui/FigmaIntensitySelectorV3.kt
          git diff --cached --check
          git commit -m "Fix workout lighting and unify intensity dock"
          git push origin HEAD:agent/workout-ui-nbio6-upgrade
