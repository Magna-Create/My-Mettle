name: Workout polish patch once

on:
  push:
    branches:
      - agent/workout-ui-nbio6-upgrade
    paths:
      - ".github/workflows/workout-polish-patch-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workout-ui-nbio6-upgrade
          fetch-depth: 0

      - name: Patch workout lighting and intensity dock
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workout = Path("app/src/main/java/dev/kian/mymettle/ui/FigmaWorkoutSessionV2.kt")
          text = workout.read_text()

          old_import = "import androidx.compose.ui.Modifier\nimport androidx.compose.ui.draw.blur\n"
          new_import = "import androidx.compose.ui.Modifier\nimport androidx.compose.ui.draw.BlurredEdgeTreatment\nimport androidx.compose.ui.draw.blur\n"
          assert old_import in text, "Workout blur import anchor not found"
          text = text.replace(old_import, new_import, 1)

          old_lighting = '''    Box(
              Modifier
                  .fillMaxWidth()
                  .height(rowHeight)
                  .clip(shape)
                  .background(Color.White.copy(alpha = if (completed) .055f else .025f)),
          ) {
              if (isCurrent) {
                  Box(
                      Modifier
                          .size(metrics.dp(96))
                          .align(Alignment.CenterStart)
                          .blur(metrics.dp(22))
                          .background(WorkoutV2Cyan.copy(alpha = .18f), CircleShape),
                  )
              }
              Row(
                  Modifier
                      .fillMaxSize()
                      .mettleDirectionalBorder(
          '''
          new_lighting = '''    Box(
              Modifier
                  .fillMaxWidth()
                  .height(rowHeight),
          ) {
              // Keep the structural row clipped, but let the current-set light exist outside that
              // clip. The previous blurred 96dp child was clipped twice (its own blur bounds and
              // the row shape), which produced the rectangular top/bottom cut-off seen on device.
              Box(
                  Modifier
                      .matchParentSize()
                      .clip(shape)
                      .background(Color.White.copy(alpha = if (completed) .055f else .025f)),
              )
              if (isCurrent) {
                  Box(
                      Modifier
                          .size(metrics.dp(104))
                          .align(Alignment.CenterStart)
                          .blur(
                              radius = metrics.dp(40),
                              edgeTreatment = BlurredEdgeTreatment.Unbounded,
                          )
                          .background(WorkoutV2Cyan.copy(alpha = .20f), CircleShape),
                  )
              }
              Row(
                  Modifier
                      .fillMaxSize()
                      .clip(shape)
                      .mettleDirectionalBorder(
          '''
          assert old_lighting in text, "Workout current-set lighting anchor not found"
          text = text.replace(old_lighting, new_lighting, 1)
          workout.write_text(text)

          intensity = Path("app/src/main/java/dev/kian/mymettle/ui/FigmaIntensitySelectorV3.kt")
          text = intensity.read_text()
          old_dock = '''/** The fixed centre dock. It remains visible while the movable glass lens travels away. */
          @Composable
          private fun IntensityV3HandleDock(
              metrics: IntensityV3Metrics,
          ) {
              MettleGlassSurface(
                  modifier = Modifier.size(metrics.dp(46)),
                  shape = CircleShape,
                  tint = Color.White.copy(alpha = 0.018f),
                  blurRadius = metrics.dp(4),
                  refractionDisplacement = metrics.dp(2.4),
                  refractionStrength = 0.22f,
                  shadowElevation = metrics.dp(1.5),
                  borderWidth = metrics.dp(0.32),
                  borderColor = IntensityV3OnTertiaryContainer.copy(alpha = 0.10f),
              ) {
                  Canvas(modifier = Modifier.fillMaxSize()) {
                      val thin = metrics.dp(0.72).toPx()
                      drawCircle(
                          color = Color.White.copy(alpha = 0.16f),
                          radius = size.minDimension * 0.31f,
                          style = Stroke(width = thin),
                      )
                      drawCircle(
                          color = IntensityV3Tertiary.copy(alpha = 0.10f),
                          radius = size.minDimension * 0.22f,
                      )
                      drawCircle(
                          color = Color.White.copy(alpha = 0.12f),
                          radius = size.minDimension * 0.19f,
                          style = Stroke(width = thin * 0.82f),
                      )
                  }
              }
          }
          '''
          new_dock = '''/** The fixed centre dock. It remains visible while the movable glass lens travels away. */
          @Composable
          private fun IntensityV3HandleDock(
              metrics: IntensityV3Metrics,
          ) {
              // Match the workout-exit home dock: one quiet filled disc, one outer definition ring
              // and one smaller inner ring. The prior three-concentric-circle construction read as
              // a separate control rather than a home marker once the handle moved away.
              Canvas(modifier = Modifier.size(metrics.dp(48))) {
                  drawCircle(Color.White.copy(alpha = .045f))
                  drawCircle(
                      MettleOnSurface.copy(alpha = .68f),
                      style = Stroke(metrics.dp(.8).toPx()),
                  )
                  drawCircle(
                      MettleOnSurface.copy(alpha = .34f),
                      radius = size.minDimension * .22f,
                      style = Stroke(metrics.dp(.65).toPx()),
                  )
              }
          }
          '''
          assert old_dock in text, "Intensity dock anchor not found"
          text = text.replace(old_dock, new_dock, 1)
          intensity.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Magna-Create"
          git config user.email "53941598+Magna-Create@users.noreply.github.com"
          git add app/src/main/java/dev/kian/mymettle/ui/FigmaWorkoutSessionV2.kt \
                  app/src/main/java/dev/kian/mymettle/ui/FigmaIntensitySelectorV3.kt
          git diff --cached --check
          git commit -m "Fix workout lighting and unify intensity dock"
          git push origin HEAD:agent/workout-ui-nbio6-upgrade
