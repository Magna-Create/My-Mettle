name: Patch N-BIO-7C closure fixes

on:
  push:
    branches:
      - "agent/n-bio-vnext-inference"
    paths:
      - ".github/workflows/patch-nbio7c-ui-docs.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout live N-BIO-7C branch
        uses: actions/checkout@v4
        with:
          ref: agent/n-bio-vnext-inference
          fetch-depth: 0

      - name: Apply code UI and documentation patch
        run: python3 scripts/patch_nbio7c_ui_docs.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Verify PD-001 register itself was not modified by patch
        run: git diff --exit-code -- docs/n-bio-vnext/POSTPONED_DEVELOPMENT.md

      - name: Commit product patch and remove temporary patch machinery
        shell: bash
        run: |
          rm scripts/patch_nbio7c_ui_docs.py .github/workflows/patch-nbio7c-ui-docs.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Stabilise N-BIO-7C structural acceptance"
          git push origin HEAD:agent/n-bio-vnext-inference
