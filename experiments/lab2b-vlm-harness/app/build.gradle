plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'dev.kian.lab2b.vlm'
    ndkVersion '27.3.13750724'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.kian.lab2b.vlm'
        minSdk 31
        targetSdk 35
        versionCode 2
        versionName '0.2.0-cpu-gpu-ocr'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
        buildConfigField 'String', 'RUNTIME_VERSION', '"MNN 3.6.1"'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs.useLegacyPackaging = false
        // Use the STL shipped as part of the verified MNN release, consistently.
        jniLibs.pickFirsts += ['**/libc++_shared.so']
    }
    sourceSets.main.jniLibs.srcDirs = ['../.deps/jniLibs']
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    testImplementation 'junit:junit:4.13.2'
}
