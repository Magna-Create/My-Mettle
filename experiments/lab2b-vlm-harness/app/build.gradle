plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def prebuiltNative = providers.gradleProperty('lab2bPrebuiltNative').orNull == 'true'
// OCR-only builds do not use MNN/JNI. This is the normal Termux Cloud Vision route.
def ocrOnly = providers.gradleProperty('lab2bOcrOnly').orNull == 'true'
if (ocrOnly && prebuiltNative) throw new GradleException('Choose OCR-only or prebuilt native, not both')
if (prebuiltNative) {
    def manifestFile = file('../.deps/prebuilt/manifest.json')
    if (!manifestFile.isFile()) throw new GradleException('Import the source-matched native bundle first')
    def manifest = new groovy.json.JsonSlurper().parse(manifestFile)
    def sha = { File f -> java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString() }
    manifest.sources.each { name, hash ->
        if (sha(file('../' + name)) != hash) throw new GradleException('Native bundle source mismatch: ' + name)
    }
    manifest.files.each { name, hash ->
        if (sha(file('../.deps/prebuilt/arm64-v8a/' + name)) != hash) throw new GradleException('Native bundle file mismatch: ' + name)
    }
}

android {
    namespace 'dev.kian.lab2b.vlm'
    if (!prebuiltNative && !ocrOnly) ndkVersion '27.3.13750724'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.kian.lab2b.vlm'
        minSdk 31
        targetSdk 35
        versionCode 9
        versionName '0.6.2-cloud-vision-lab'

        ndk {
            abiFilters 'arm64-v8a'
        }

        if (!prebuiltNative && !ocrOnly) externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
        buildConfigField 'String', 'RUNTIME_VERSION', '"MNN 3.6.1"'
        buildConfigField 'boolean', 'OCR_ONLY', ocrOnly ? 'true' : 'false'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs.useLegacyPackaging = false
        if (prebuiltNative) jniLibs.keepDebugSymbols += ['**/*.so']
        // Use the STL shipped as part of the verified MNN release, consistently.
        jniLibs.pickFirsts += ['**/libc++_shared.so']
    }
    if (!ocrOnly) sourceSets.main.assets.srcDirs += ['../third_party']
    sourceSets.main.jniLibs.srcDirs = ocrOnly ? [] : [prebuiltNative ? '../.deps/prebuilt' : '../.deps/jniLibs']
    if (!prebuiltNative && !ocrOnly) externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303' // JVM implementation for Cloud Vision JSON contract tests
}
